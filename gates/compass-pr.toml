name = "compass-pr"
version = "1.0"

# Pull-request tier: only evidence a PR can produce offline.
# Production evidence (latency, online signals) and suites not
# yet built are enforced by compass-release.toml at release.

[[limits]]
kind = "max"
metric = "OBJ-CREDIT-01.failure_rate.upper"
value = 0.01
severity = "block"
objective = "OBJ-CREDIT-01"

[[limits]]
kind = "max"
metric = "OBJ-CLAIM-01.failures"
value = 0
severity = "block"
objective = "OBJ-CLAIM-01"

[[limits]]
kind = "max"
metric = "OBJ-CONTACT-01.failures"
value = 0
severity = "block"
objective = "OBJ-CONTACT-01"

[[limits]]
kind = "max"
metric = "regression.failures"
value = 0
severity = "block"
objective = "REGRESSION-SET"

[[no_regression]]
evaluator = "credit-cascade"
severity = "block"
objective = "OBJ-CREDIT-01"

[[no_regression]]
evaluator = "claim-deadline"
severity = "block"
objective = "OBJ-CLAIM-01"
