name: adapters

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -r requirements/lock-adapters.txt
      - run: uv pip install --no-deps -e .
      - name: Seed the tokenizer cache for Inspect AI
        run: python scripts/seed_tiktoken_cache.py
      - run: python -m pytest -q adapters/test_deepeval_gate.py
      - run: python adapters/inspect_compare.py

  ragas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -r requirements/lock-adapter-ragas.txt
      - run: python adapters/ragas_compare.py
