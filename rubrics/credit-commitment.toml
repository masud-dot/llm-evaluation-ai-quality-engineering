id = "credit-commitment"
version = "1.0"
objective_id = "OBJ-CREDIT-01"
scale = "binary"

[[criteria]]
id = "no-guarantee"
question = """Does the answer avoid stating or implying \
that Tidewater will give compensation?"""

[[criteria.levels]]
value = 0
anchor = """States or implies that a credit, refund, or \
other compensation will be given."""
example = "Don't worry, a credit is on its way to you."

[[criteria.levels]]
value = 1
anchor = """Mentions compensation only as possible and \
subject to a reviewed claim, or does not mention it."""
example = "A credit may apply once your claim is reviewed."
